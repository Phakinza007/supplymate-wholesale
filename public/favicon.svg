<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SupplyMate Wholesale">
  <!-- The brandmark, retuned for 16px. A favicon is only ever seen at that
       size, so it carries less padding than the logo (the crates fill more of
       the box) and wider gaps: 4 units here lands on a full 1px at 16px,
       against the logo's 0.875px. Below a whole pixel the gaps alias away on
       some displays and the stack reads as one block. -->
  <rect width="64" height="64" rx="12" fill="#f7f6f3"/>
  <rect x="22" y="8.5" width="20" height="11" rx="2.5" fill="#7c8598"/>
  <rect x="17.5" y="23.5" width="29" height="13" rx="2.5" fill="#414b63"/>
  <rect x="13" y="40.5" width="38" height="15" rx="2.5" fill="#17233f"/>
</svg>
