<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img"
     aria-label="ตัวอย่าง QR พร้อมเพย์ สำหรับการสาธิตเท่านั้น ไม่สามารถสแกนจ่ายได้">
  <title>ตัวอย่าง QR พร้อมเพย์ (สาธิต)</title>
  <rect width="240" height="240" rx="12" fill="#ffffff"/>
  <rect x="6" y="6" width="228" height="228" rx="8" fill="none" stroke="#17233f" stroke-width="2"
        stroke-dasharray="8 6"/>
  <!-- Deliberately not a scannable code: three finder squares and nothing a
       reader can decode, so nobody can mistake this placeholder for a real
       payment target. -->
  <g fill="#17233f">
    <rect x="30" y="30" width="46" height="46" rx="6"/>
    <rect x="164" y="30" width="46" height="46" rx="6"/>
    <rect x="30" y="164" width="46" height="46" rx="6"/>
  </g>
  <g fill="#ffffff">
    <rect x="42" y="42" width="22" height="22" rx="3"/>
    <rect x="176" y="42" width="22" height="22" rx="3"/>
    <rect x="42" y="176" width="22" height="22" rx="3"/>
  </g>
  <text x="120" y="118" text-anchor="middle" font-family="Anuphan, sans-serif"
        font-size="17" font-weight="700" fill="#17233f">ตัวอย่าง</text>
  <text x="120" y="140" text-anchor="middle" font-family="Anuphan, sans-serif"
        font-size="12" fill="#6f6f6a">สแกนจ่ายไม่ได้</text>
  <text x="120" y="222" text-anchor="middle" font-family="Anuphan, sans-serif"
        font-size="11" fill="#8a877f">แทนที่ด้วย QR จริงของร้าน</text>
</svg>
