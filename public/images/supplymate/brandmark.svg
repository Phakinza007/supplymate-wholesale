<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">SupplyMate Wholesale</title>
  <!-- Three stacked crates, widest and heaviest at the base.
       Two constraints drive the numbers:
       - Legible at 16px. The gaps are 3.5 units, which is 0.875px at that
         size; anything thinner closes up and the stack reads as one blob.
       - Prints in a single colour. The tonal steps carry the "heavy to light"
         idea, but they cannot be what separates the crates, so the silhouette
         does that on its own. The lightest tone is still dark enough to hold
         against the panel once colour is thrown away. -->
  <rect width="64" height="64" rx="14" fill="#f7f6f3"/>
  <rect x="23" y="10.5" width="18" height="10" rx="2.5" fill="#7c8598"/>
  <rect x="19" y="24" width="26" height="12" rx="2.5" fill="#414b63"/>
  <rect x="15" y="39.5" width="34" height="14" rx="2.5" fill="#17233f"/>
</svg>
